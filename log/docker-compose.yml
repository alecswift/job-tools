services:
  log:
    build:
      context: ..   # the repo root, so the image can include the shared design/
      dockerfile: log/Dockerfile
    container_name: log
    ports:
      - "127.0.0.1:8002:8002"   # localhost only, same as running it directly
    environment:
      TZ: America/Los_Angeles
      LOG_DATA: /log-data/log.sqlite3
      # Where the app switcher's links go (set in .env if either app moves)
      LEETCODE_URL: ${LEETCODE_URL:-}
      LOG_URL: ${LOG_URL:-}
    volumes:
      - .:/job-tools/log               # this app's code
      - ../design:/job-tools/design:ro # the shared design/, and nothing else from the repo
      # Where log.sqlite3 lives: the log-data/ repo next to this one unless LOG_DATA_DIR is set (in .env, say).
      # Mount the folder, not the file: SQLite writes a journal file next to it.
      - ${LOG_DATA_DIR:-../log-data}:/log-data
    # Run the code from the mounted folder in dev mode, so edits to lib/, public/ and
    # design/ take effect without a rebuild (the server restarts, open pages reload).
    # Gemfile changes still need `docker compose up -d --build`.
    working_dir: /job-tools/log
    command: ["bin/server", "--dev"]
    restart: unless-stopped
