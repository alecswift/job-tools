<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/components.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<div class="brand">LeetCode Helper</div>

<header class="top">
  <span class="today" id="today"></span>
  <button class="btn primary" id="addBtn">+ Log problem</button>
</header>

<div class="side">
  <nav aria-label="Pages">
    <a href="#plan" data-view="plan">Plan</a>
    <a href="#retryqueue" data-view="retryqueue">Retry queue</a>
    <a href="#log" data-view="log">Log</a>
    <a href="#how" data-view="how">How it works</a>
  </nav>
</div>

<main id="view"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm" novalidate></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="main.js"></script>
</body>
</html>
